<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <div class="site-footer__col">
      <a class="wordmark wordmark--footer" href="{{ '/' | relative_url }}">
        {% include mark.html %}
        <span>{{ site.title }}</span>
      </a>
      <p>{{ site.description }}</p>
      <p class="fineprint">{{ site.title }} is a registered 501(c)(3) nonprofit &middot; EIN {{ site.ein }}</p>
    </div>

    <div class="site-footer__col">
      <h2>Elsewhere</h2>
      <ul class="plain-list">
        <li><a href="{{ site.mailing_list_url }}">Mailing list</a></li>
        <li><a href="{{ site.bluesky_url }}">Bluesky</a></li>
        <li><a href="{{ '/donate/' | relative_url }}">Donate</a></li>
      </ul>
    </div>

    <div class="site-footer__col">
      <h2>Site</h2>
      <ul class="plain-list">
        {% for item in site.nav %}
        <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </div>
  </div>
</footer>
