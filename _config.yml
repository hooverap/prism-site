title: Spectra
tagline: The Association for LGBTQ+ Mathematicians
description: >-
  Spectra is the association for LGBTQ+ mathematicians and their allies,
  building recognition and community for gender and sexual minority
  mathematicians.
# Leave empty while the site is served from hooverap.github.io/prism-site.
# When lgbtmath.org points here, set this to "https://www.lgbtmath.org".
url: ""
# The site lives under /prism-site on hooverap.github.io. Set this to "" when
# lgbtmath.org (a custom domain at the root) points here.
baseurl: "/prism-site"

ein: "99-1720827"
donate_url: "https://secure.givelively.org/donate/spectra-the-association-for-lgbtq-mathematicians"
mailing_list_url: "https://groups.google.com/d/forum/spectra-math"
mailing_list_subscribe_url: "https://groups.google.com/group/spectra-math/boxsubscribe"
bluesky_url: "https://bsky.app/profile/lgbtmath.org"
facebook_url: "https://www.facebook.com/groups/OutInMath/"
council_email: "board@lgbtmath.org"
# Google Form used to join or update the Out List and Ally List
list_signup_url: "https://docs.google.com/forms/d/e/1FAIpQLScLcxGm9u1ufGdYknxS_E0RuGY9BOubJ2OYXcVeAvrR3NL1_g/viewform"
volunteer_form_url: "https://forms.gle/52cZxkAw47AvBfk97"

# Top navigation. An item with `children` becomes a drop-down menu.
# `button: true` styles an item as a button (used for Donate).
nav:
  - title: About
    children:
      - title: Council
        url: /council/
      - title: Board
        url: /board/
      - title: History
        url: /history/
      - title: Resources
        url: /resources/
  - title: Events
    children:
      - title: Spectra Events
        url: /events/
      - title: LGBTQ+ Math Events
        url: /events/lgbtq-math/
      - title: Add Event
        url: /events/add/
  - title: Community
    children:
      - title: Out List
        url: /outlist/
      - title: Ally List
        url: /allyship/#ally-list
      - title: Institutional Members
        url: /allyship/#institutional-members
      - title: Member Directory
        url: /members/directory/
      - title: Member Sign In
        url: /members/sign-in/
  - title: Get Involved
    children:
      - title: Join
        url: /members/join/
      - title: Student Chapters
        url: /join/#student-chapters
      - title: Volunteer
        url: /volunteer/
      - title: Mailing List
        url: /join/#mailing-list
  - title: Donate
    url: /donate/
    button: true

markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
